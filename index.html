<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7A1F2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CDA">

  <title>Club Defensor Amay</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./cda_apple_touch_180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./cda_android_192.png">
  <link rel="icon" type="image/png" sizes="64x64" href="./cda_favicon_64.png">

  <style>
    :root {
      --vino: #7A1F2B;
      --vino-oscuro: #5A1421;
      --fondo: #F4F6FA;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--vino);
    }

    #appShell {
      position: fixed;
      top: var(--safe-top);
      left: 0;
      right: 0;
      bottom: var(--safe-bottom);
      background: var(--fondo);
      overflow: hidden;
    }

    #appFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--fondo);
    }

    #cargando {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--vino-oscuro), var(--vino));
      color: white;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      transition: opacity .25s ease, visibility .25s ease;
    }

    #cargando.oculto {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cargando-contenido {
      text-align: center;
      padding: 24px;
    }

    .cargando-logo {
      width: 118px;
      height: 118px;
      border-radius: 28px;
      object-fit: cover;
      box-shadow: 0 10px 28px rgba(0,0,0,.24);
    }

    .cargando-titulo {
      margin-top: 18px;
      font-size: 23px;
      font-weight: 800;
    }

    .cargando-texto {
      margin-top: 6px;
      font-size: 14px;
      opacity: .86;
    }
  </style>
</head>
<body>
  <div id="cargando">
    <div class="cargando-contenido">
      <img class="cargando-logo" src="./cda_android_192.png" alt="Club Defensor Amay">
      <div class="cargando-titulo">Club Defensor Amay</div>
      <div class="cargando-texto">Cargando aplicativo...</div>
    </div>
  </div>

  <div id="appShell">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwYKQGtAGzRNZXn4xu-7Gbiq88X-wR3bM9WuIsS4uKJ6LpoyFEhimZjP_vfs9A_Eyoa/exec"
      title="Aplicativo Club Defensor Amay"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <script>
    const frame = document.getElementById('appFrame');
    const cargando = document.getElementById('cargando');

    frame.addEventListener('load', function () {
      setTimeout(function () {
        cargando.classList.add('oculto');
      }, 250);
    });

    setTimeout(function () {
      cargando.classList.add('oculto');
    }, 6000);
  </script>
</body>
</html>
